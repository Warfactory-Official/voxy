name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        run: ./gradlew build --no-daemon

      - name: Stage version artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          found=0
          while IFS= read -r jar; do
            found=1
            project=$(basename "$(dirname "$(dirname "$(dirname "$jar")")")")
            name=$(basename "$jar")
            cp "$jar" "dist/${project}-${name}"
          done < <(
            find versions -type f -path '*/build/libs/*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-slim.jar' | sort
          )

          if [[ "$found" -eq 0 ]]; then
            echo 'No version artifacts were produced.' >&2
            exit 1
          fi

          ls -lh dist

      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxy-version-artifacts
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automated build of ${GITHUB_SHA}" \
            --latest=false
